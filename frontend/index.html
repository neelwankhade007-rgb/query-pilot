<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Query-Pilot Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#c3c6d7",
                        "surface-bright": "#31394d",
                        "on-secondary-container": "#00311f",
                        "on-tertiary": "#472a00",
                        "on-secondary-fixed-variant": "#005236",
                        "tertiary-container": "#996100",
                        "surface-container-highest": "#2d3449",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-container": "#ffeedd",
                        "surface-container": "#171f33",
                        "primary-fixed-dim": "#b4c5ff",
                        "secondary": "#4edea3",
                        "on-surface": "#dae2fd",
                        "secondary-container": "#00a572",
                        "on-primary-container": "#eeefff",
                        "outline": "#8d90a0",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-dim": "#0b1326",
                        "tertiary-fixed": "#ffddb8",
                        "secondary-fixed": "#6ffbbe",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-high": "#222a3d",
                        "surface-container-lowest": "#060e20",
                        "surface": "#0b1326",
                        "outline-variant": "#434655",
                        "secondary-fixed-dim": "#4edea3",
                        "on-primary-fixed": "#00174b",
                        "inverse-on-surface": "#283044",
                        "primary-container": "#2563eb",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-primary": "#002a78",
                        "inverse-primary": "#0053db",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-surface": "#dae2fd",
                        "on-background": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-secondary": "#003824",
                        "tertiary": "#ffb95f",
                        "surface-container-low": "#131b2e",
                        "primary": "#b4c5ff",
                        "error-container": "#93000a",
                        "surface-tint": "#b4c5ff",
                        "background": "#0b1326",
                        "on-error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "base": "4px",
                        "sidebar-width": "260px",
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "40px",
                        "md": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "code-sm": ["JetBrains Mono"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "code-md": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "code-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "code-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md md:p-xl font-body-md">
    <div class="w-full max-w-4xl bg-surface-container rounded-xl border border-surface-variant shadow-2xl p-lg md:p-[40px] flex flex-col gap-lg">
        <!-- Header -->
        <header class="flex justify-between items-center mb-sm">
            <h1 class="font-headline-md text-headline-md text-primary tracking-tight">Query-Pilot</h1>
            <div class="flex gap-sm">
                <button id="settings-btn" class="w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer">
                    <span class="material-symbols-outlined" data-icon="settings">settings</span>
                </button>
            </div>
        </header>

        <!-- Query Input Section -->
        <section class="flex flex-col gap-sm">
            <label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="query-input">Ask your database...</label>
            <div class="relative group">
                <textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-code-md text-code-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all resize-none shadow-inner" id="query-input" placeholder="Which customers bought ..." rows="4"></textarea>
                <div class="absolute bottom-md right-md flex gap-sm items-center">
                    <span class="text-xs text-outline font-code-sm hidden md:inline">⌘ + Enter to run</span>
                    <button id="run-query-btn" class="bg-primary text-on-primary font-label-caps text-label-caps px-lg py-sm rounded-lg hover:opacity-90 active:opacity-80 transition-all flex items-center gap-xs cursor-pointer shadow-md shadow-primary/20">
                        <span class="material-symbols-outlined text-[16px]" data-icon="play_arrow">play_arrow</span>
                        Run Query
                    </button>
                </div>
            </div>
        </section>

        <!-- Divider -->
        <hr class="border-t border-surface-variant my-sm"/>

        <!-- Results Section -->
        <section id="results-section" class="flex flex-col gap-sm">
            <h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-xs">
                <span class="material-symbols-outlined text-[14px] text-secondary" data-icon="auto_awesome">auto_awesome</span>
                Results
            </h2>
            <div id="results-container" class="overflow-x-auto rounded-lg border border-surface-variant bg-surface-container-lowest min-h-[120px] flex items-center justify-center">
                <div id="empty-state" class="text-on-surface-variant font-code-sm text-center py-lg px-md">
                    No results yet. Enter a query above and click <span class="text-primary font-semibold">Run Query</span>.
                </div>
                <table id="results-table" class="w-full text-left border-collapse hidden">
                    <thead id="results-head" class="bg-surface-container-low border-b border-surface-variant font-label-caps text-label-caps text-on-surface-variant sticky top-0 backdrop-blur-sm">
                        <!-- Dynamic columns header -->
                    </thead>
                    <tbody id="results-body" class="font-code-md text-code-md text-on-surface">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
            <div id="results-stats" class="flex justify-between items-center mt-xs text-on-surface-variant font-code-sm text-code-sm hidden">
                <span id="row-count"></span>
                <span id="execution-time"></span>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
